[package]
name = "agora-server"
description = "Agora HTTP/SSE server: serves the web UI and API for desktop, browser and phone."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agora-server"
path = "src/main.rs"

[[bin]]
name = "agora-mcp"
path = "src/bin/agora-mcp.rs"

[dependencies]
agora-core = { path = "../agora-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rust-embed = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
