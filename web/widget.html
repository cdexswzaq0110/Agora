<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agora 用量</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <style>
    body { background: #111111; color: #ece8e4; min-height: 0; font-size: 13px; }
    .w { padding: 0.8rem 0.95rem; display: grid; gap: 0.55rem; }
    .w-head { display: flex; justify-content: space-between; align-items: baseline; font: 600 0.62rem/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; color: #a39e9a; }
    .w-head a { color: #a39e9a; text-decoration: none; }
    .w-row { display: grid; grid-template-columns: 4.6rem 1fr 2.8rem; align-items: center; gap: 0.6rem; }
    .w-row b { font: 700 0.66rem/1 var(--font-display); letter-spacing: 0.14em; }
    .w-row .fam-claude { color: #d98a63; }
    .w-row .fam-gpt { color: #6fb09c; }
    .w-row em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
    .w-row .hp { width: 100%; height: 0.62rem; --seg-off: #34312e; }
    .w-sub { grid-column: 2 / -1; color: #8f8983; font-size: 0.72rem; margin-top: -0.3rem; }
    .w-empty { color: #8f8983; }
  </style>
  <script src="/widget.js" defer></script>
</head>
<body>
  <div class="w">
    <div class="w-head"><span>Agora · 剩餘用量</span><a href="/" target="_blank" rel="noopener">開啟 ↗</a></div>
    <div id="rows"><span class="w-empty">讀取中…</span></div>
  </div>
</body>
